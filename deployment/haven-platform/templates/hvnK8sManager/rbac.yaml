apiVersion: v1
kind: ServiceAccount
metadata:
    name: {{ include "haven.hvnK8sManager.fullname" . }}
    namespace: {{ include "haven.hvnK8sManager.namespace" . }}
    labels:
        {{- include "haven.hvnK8sManager.labels" . | nindent 8 }}
---
# Cluster-scoped: no namespace. Grant only what the code uses; add verbs as features need them.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: {{ include "haven.hvnK8sManager.clusterName" . }}
    labels:
        {{- include "haven.hvnK8sManager.labels" . | nindent 8 }}
rules:
    - apiGroups: [""]
      resources: ["namespaces"]
      verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
    name: {{ include "haven.hvnK8sManager.clusterName" . }}
    labels:
        {{- include "haven.hvnK8sManager.labels" . | nindent 8 }}
subjects:
    - kind: ServiceAccount
      name: {{ include "haven.hvnK8sManager.fullname" . }}
      namespace: {{ include "haven.hvnK8sManager.namespace" . }}
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: {{ include "haven.hvnK8sManager.clusterName" . }}
