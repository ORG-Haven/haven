# Haven edge proxy: the only service reachable from outside the compose network.
# Browser -> nginx -> hvn-console (Next) -> /api/* -> hvn-bff
#
# Next passes X-Forwarded-For through unchanged and never adds to it, so the value nginx
# sets here is exactly what the BFF reads (TRUSTED_PROXY_HOPS=1).
#
# Behind a cloud load balancer, $remote_addr is the balancer, not the client. Then restore
# the client address first, trusting only the balancer's range:
#   set_real_ip_from 10.0.0.0/8;
#   real_ip_header   X-Forwarded-For;
#   real_ip_recursive on;

# Coarse flood protection per client address, in front of the BFF's own per-IP and
# per-account limits (which are stricter and also cover password guessing).
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_status 429;

upstream console {
    server hvn-console:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Requests are small JSON forms and page loads; matches the BFF's 1 MiB body cap.
    client_max_body_size 1m;
    server_tokens off;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # $http_host keeps the port, so redirects from Next (e.g. to /signin) stay on this address.
    proxy_set_header Host              $http_host;
    # Overwrite, not append: anything the client put in X-Forwarded-For is thrown away.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;

    location / {
        proxy_pass http://console;
    }

    location ~ ^/api/auth/(signin|signup)$ {
        limit_req zone=auth burst=10 nodelay;
        error_page 429 = @too_many;
        proxy_pass http://console;
    }

    # Same {"message"} shape as BFF errors, so the console shows it as is.
    location @too_many {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"message":"Too many requests. Wait a minute and try again."}';
    }
}
