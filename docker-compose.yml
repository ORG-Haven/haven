services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-haven}
      POSTGRES_USER: ${POSTGRES_USER:-haven}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-haven}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  hvn-bff:
    build: ./hvn-bff
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-haven}:${POSTGRES_PASSWORD:-haven}@postgres:5432/${POSTGRES_DB:-haven}?sslmode=disable
      COOKIE_SECURE: "false"
      ALLOWED_ORIGINS: http://localhost:${CONSOLE_PORT:-3000}
    ports:
      - "${BFF_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  hvn-console:
    build: ./hvn-console
    restart: unless-stopped
    environment:
      HVN_BFF_URL: http://hvn-bff:8080
    ports:
      - "${CONSOLE_PORT:-3000}:3000"
    depends_on:
      - hvn-bff

volumes:
  postgres-data:
